<!--
    Aquí llamamos al componente Navbar.

    "app-navbar" viene del selector que está
    definido en navbar.component.ts.

    Angular reemplazará esta etiqueta por todo
    el contenido de navbar.component.html.
-->
<app-navbar></app-navbar>

<!--
    Hero:
    Es la primera sección importante que verá
    el usuario después del Navbar.

    Su objetivo es explicar rápidamente:
    - quiénes somos
    - qué hacemos
    - por qué debería interesarle al visitante
-->
<app-hero></app-hero>

<!--
    NUESTRO PROPÓSITO

    Esta sección explica por qué nació la comunidad
    y qué buscamos aportar.

    Importante:
    hablamos de nuestros objetivos, no afirmamos
    haber realizado actividades que todavía no existen.
--!>
<app-purpose></app-purpose>

<!-- Integrantes de la comunidad -->
 <app-purpose></app-purpose>

<app-team></app-team>
<!--
    EXPERIENCIAS

    Esta sección responde a:
    "¿Qué ha hecho k’ak’b’e.lab?"

    Inicialmente mostraremos la participación
    del equipo en el Hackathon Nacional 2026.

    Más adelante podrá crecer con nuevas
    experiencias reales de la comunidad.
-->
<app-experiences></app-experiences>

<!--
    COLABORA CON NOSOTRAS

    Esta sección está dirigida principalmente a:

    - empresas
    - profesionales
    - instituciones
    - organizaciones

    Su objetivo es explicar de manera concreta
    cómo pueden apoyar o colaborar con k’ak’b’e.lab.
-->

<app-collaboration></app-collaboration>

<!--
    CONTACTO

    Esta sección permite que cualquier persona
    interesada en k’ak’b’e.lab pueda contactarnos.

    Contiene un formulario de contacto y
    nuestros datos de contacto.
-->
<app-contact></app-contact>

<!--
    PIE DE PÁGINA

    Aquí podemos colocar información adicional
    que queramos mostrar en todas las páginas.

    Por ejemplo:
    - derechos de autor
    - enlaces a redes sociales
    - información legal
-->
<app-footer></app-footer>
