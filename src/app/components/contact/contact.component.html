<!--
    ==========================================
    SECCIÓN: CONTACTO
    ==========================================

    Esta sección permite que personas,
    empresas, instituciones y organizaciones
    puedan comunicarse con k’ak’b’e.lab.

    IMPORTANTE EN ANGULAR:

    El carácter @ puede ser interpretado por
    Angular como parte de su sintaxis moderna.

    Por eso, cuando necesitamos MOSTRAR un @
    dentro del contenido HTML utilizamos:

    &#64;

    El navegador lo mostrará normalmente como @.
-->
<section class="contact" id="contacto">

    <div class="container">

        <!--
            ==========================================
            CONTENIDO PRINCIPAL
            ==========================================

            En escritorio tendremos dos columnas:

            IZQUIERDA:
            invitación a contactar.

            DERECHA:
            canales de comunicación.

            En dispositivos pequeños Bootstrap
            colocará una columna debajo de la otra.
        -->
        <div class="row g-5 align-items-center">


            <!--
                ======================================
                COLUMNA IZQUIERDA
                ======================================
            -->
            <div class="col-lg-6">

                <!-- Etiqueta de la sección -->
                <span class="contact-label">
                    CONTACTO
                </span>


                <!-- Título principal -->
                <h2 class="contact-title">

                    ¿Quieres conectar

                    <span>
                        con nosotras?
                    </span>

                </h2>


                <!--
                    Explicamos brevemente por qué
                    alguien podría contactarnos.
                -->
                <p class="contact-description">

                    Si quieres conocer nuestra comunidad,
                    compartir una oportunidad, proponer una
                    colaboración o simplemente conversar sobre
                    lo que estamos construyendo, nos encantará
                    escucharte.

                </p>

            </div>


            <!--
                ======================================
                COLUMNA DERECHA
                ======================================

                Contiene:

                - Instagram
                - correo
                - WhatsApp
            -->
            <div class="col-lg-6">

                <div class="contact-options">


                    <!--
                        ==================================
                        INSTAGRAM
                        ==================================

                        target="_blank":
                        abre Instagram en otra pestaña.

                        rel="noopener noreferrer":
                        es una medida de seguridad recomendada
                        para enlaces externos.

                        IMPORTANTE:

                        Para mostrar:

                        @kakbe.lab

                        escribimos:

                        &#64;kakbe.lab
                    -->
                    <div class="contact-item">

                        <span class="contact-item-label">
                            Instagram
                        </span>


                        <a
                            href="https://www.instagram.com/kakbe.lab?stkn=ZDNlZDc0MzIxNw=="
                            target="_blank"
                            rel="noopener noreferrer"
                            class="contact-link"
                            aria-label="Abrir Instagram de k'ak'b'e.lab"
                        >
                            &#64;kakbe.lab
                            <span aria-hidden="true">↗</span>
                        </a>

                    </div>


                    <!--
                        ==================================
                        CORREO
                        ==================================

                        mailto:
                        permite abrir la aplicación de
                        correo del visitante.

                        En href podemos mantener la dirección.

                        Para MOSTRAR el correo escribimos:

                        nebulinas&#64;yahoo.com

                        El navegador mostrará:

                        nebulinas@yahoo.com
                    -->
                    <div class="contact-item">

                        <span class="contact-item-label">
                            Correo
                        </span>


                        <a
                            href="mailto:nebulinas@yahoo.com"
                            class="contact-link"
                            aria-label="Enviar correo a k'ak'b'e.lab"
                        >
                            kakbelab&#64;gmail.com
                        </a>

                    </div>


                    <!--
                        ==================================
                        WHATSAPP
                        ==================================

                        Número mostrado:

                        +502 4087 4610

                        Para crear un enlace de WhatsApp
                        usamos el número completo sin:

                        - signo +
                        - espacios
                        - guiones

                        Resultado:

                        50240874610
                    -->
                    <div class="contact-item">

                        <span class="contact-item-label">
                            WhatsApp
                        </span>


                        <a
                            href="https://wa.me/50240874610"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="contact-link"
                            aria-label="Contactar a k'ak'b'e.lab por WhatsApp"
                        >
                            +502 4087 4610
                            <span aria-hidden="true">↗</span>
                        </a>

                    </div>


                </div>

            </div>


        </div>

    </div>

</section>
