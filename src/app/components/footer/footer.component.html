<!--
    ==========================================
    FOOTER
    ==========================================

    El Footer cierra la página y cumple cuatro funciones:

    1. Reforzar la identidad de k’ak’b’e.lab.
    2. Ofrecer navegación secundaria.
    3. Facilitar acceso a redes sociales.
    4. Mostrar discretamente el crédito
       de diseño y desarrollo web.
-->
<footer class="footer">

    <div class="container">


        <!--
            ==========================================
            CONTENIDO PRINCIPAL
            ==========================================

            row:
            crea una fila con Bootstrap.

            gy-4:
            agrega espacio vertical cuando las columnas
            se colocan una debajo de otra en móvil.

            align-items-center:
            centra verticalmente las columnas.
        -->
        <div class="row gy-4 align-items-center">


            <!--
                ======================================
                MARCA
                ======================================

                En escritorio ocupa 4 de las
                12 columnas de Bootstrap.
            -->
            <div class="col-lg-4">

                <a
                    href="#"
                    class="footer-brand"
                    aria-label="Ir al inicio de k'ak'b'e.lab"
                >

                    <!--
                        Reutilizamos el logo que ya tenemos
                        guardado dentro de assets.
                    -->
                    <img
                        src="assets/images/logo-kakbe.png"
                        alt="Logo de k'ak'b'e.lab"
                        class="footer-logo"
                    >


                    <!-- Nombre de la comunidad -->
                    <span class="footer-brand-name">

                        <span class="footer-kakbe">
                            k’ak’b’e
                        </span>

                        <span class="footer-lab">
                            .lab
                        </span>

                    </span>

                </a>


                <!--
                    Una frase muy corta que resume
                    la identidad de la comunidad.
                -->
                <p class="footer-tagline">
                    Tecnología · Comunidad · Oportunidades
                </p>

            </div>


            <!--
                ======================================
                NAVEGACIÓN SECUNDARIA
                ======================================

                En escritorio ocupa 5 columnas.
            -->
            <div class="col-lg-5">

                <nav
                    class="footer-navigation"
                    aria-label="Navegación del pie de página"
                >

                    <a href="#">
                        Inicio
                    </a>

                    <a href="#nosotras">
                        Nosotras
                    </a>

                    <a href="#proposito">
                        Propósito
                    </a>

                    <a href="#equipo">
                        Equipo
                    </a>

                    <a href="#colabora">
                        Colabora
                    </a>

                    <a href="#contacto">
                        Contacto
                    </a>

                </nav>

            </div>


            <!--
                ======================================
                REDES
                ======================================

                Por ahora dejamos Instagram.

                Si posteriormente crean LinkedIn,
                TikTok u otra red, podemos agregarla aquí.
            -->
            <div class="col-lg-3">

                <div class="footer-social">

                    <span class="footer-social-label">
                        Síguenos
                    </span>


                    <!--
                        REEMPLAZAR:
                        coloca aquí la URL real del
                        Instagram de k’ak’b’e.lab.
                    -->
                    <a
                        href="[REEMPLAZAR: URL DE INSTAGRAM]"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Instagram ↗
                    </a>

                </div>

            </div>

        </div>


        <!--
            Línea que separa el contenido principal
            de la información legal y los créditos.
        -->
        <div class="footer-divider"></div>


        <!--
            ==========================================
            PARTE INFERIOR
            ==========================================
        -->
        <div class="footer-bottom">


            <!-- Derechos / identidad -->
            <p class="footer-copyright">
                © 2026 k’ak’b’e.lab · Todos los derechos reservados.
            </p>


            <!--
                ======================================
                CRÉDITO DE DESARROLLO
                ======================================

                Este crédito se mantiene pequeño y discreto.

                La protagonista de la página sigue siendo
                k’ak’b’e.lab.

                REEMPLAZAR:
                coloca aquí la URL de tu portafolio.
            -->
            <p class="footer-credit">

                Diseño y desarrollo web por

                <a
                    href="[REEMPLAZAR: URL DE TU PORTAFOLIO]"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Evelyn ↗
                </a>

            </p>

        </div>

    </div>

</footer>
