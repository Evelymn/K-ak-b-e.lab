<!--

    FOOTER
    ==========================================

    El footer utiliza una composición horizontal
    y compacta, similar al Navbar.

    En escritorio tendremos:

    MARCA | NAVEGACIÓN | REDES

    Debajo dejamos únicamente:
    copyright | crédito de desarrollo
-->
<footer class="footer">

    <div class="container">


        <!--
            ==========================================
            FILA PRINCIPAL
            ==========================================
        -->
        <div class="footer-main">


            <!--
                ======================================
                MARCA
                ======================================
            -->
            <a
                href="#inicio"
                class="footer-brand"
                aria-label="Ir al inicio de k'ak'b'e.lab"
            >

                <img
                    src="assets/images/logo-kakbe.png"
                    alt="Logo de k'ak'b'e.lab"
                    class="footer-logo"
                >


                <span class="footer-brand-name">

                    <span class="footer-kakbe">
                        k’ak’b’e
                    </span><span class="footer-lab">.lab</span>

                </span>

            </a>


            <!--
                ======================================
                NAVEGACIÓN
                ======================================
            -->
            <nav
                class="footer-navigation"
                aria-label="Navegación del pie de página"
            >

                <a href="#inicio">
                    Inicio
                </a>

                <a href="#proposito">
                    Propósito
                </a>

                <a href="#equipo">
                    Equipo
                </a>

                <a href="#experiencias">
                    Experiencias
                </a>

                <a href="#colabora">
                    Colabora
                </a>

                <a href="#contacto">
                    Contacto
                </a>

            </nav>


            <!--
                ======================================
                RED SOCIAL
                ======================================

                La URL debe escribirse directamente
                dentro de href.

                No utilizamos sintaxis Markdown.
            -->
            <div class="footer-social">

                <a
                    href="https://www.instagram.com/kakbe.lab?stkn=ZDNlZDc0MzIxNw=="
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram de k'ak'b'e.lab"
                >
                    Instagram ↗
                </a>

            </div>


        </div>


        <!--
            Línea divisoria.
        -->
        <div class="footer-divider"></div>


        <!--
            ==========================================
            FILA INFERIOR
            ==========================================
        -->
        <div class="footer-bottom">


            <p class="footer-copyright">
                © 2026 k’ak’b’e.lab · Todos los derechos reservados.
            </p>


            <p class="footer-credit">

                Diseño y desarrollo web por

                    IMPORTANTE:
                    aquí coloca posteriormente la URL

                -->

                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"

            </p>


        </div>


    </div>

</footer>
